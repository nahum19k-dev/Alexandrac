<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Alexandra &middot; Una constelaci&oacute;n para ti</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=espacio-movil-1">
</head>
<body>
    <div class="sky-atmosphere" aria-hidden="true"></div>
    <canvas id="star-canvas" aria-hidden="true"></canvas>
    <div class="film-vignette" aria-hidden="true"></div>

    <main>
        <section id="landing-screen" class="screen active" aria-labelledby="welcome-title">
            <div class="landing-content">
                <p class="welcome-phrase">Hay encuentros que merecen<br>su propia constelaci&oacute;n</p>
                <div class="welcome-stars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
                <span class="title-prelude">Para</span>
                <h1 id="welcome-title" class="title">Alexandra</h1>
                <p class="subtitle">Una constelaci&oacute;n de pensamientos para ti</p>
                <button id="open-btn" class="primary-btn">Leer la carta
                    <span class="entry-star" aria-hidden="true">
                        <svg viewBox="0 0 32 32" focusable="false">
                            <defs><radialGradient id="entry-star-light"><stop stop-color="#fffdf1"/><stop offset=".5" stop-color="#ffe8ad"/><stop offset="1" stop-color="#a56b4c"/></radialGradient></defs>
                            <path class="entry-star-shape" d="M16 2 C17.5 12 20 14.5 30 16 C20 17.5 17.5 20 16 30 C14.5 20 12 17.5 2 16 C12 14.5 14.5 12 16 2Z" fill="url(#entry-star-light)"/>
                            <circle class="entry-spark spark-one" cx="27" cy="6" r="1.6" fill="#fff4cc"/>
                            <circle class="entry-spark spark-two" cx="5" cy="26" r="1.2" fill="#fff4cc"/>
                        </svg>
                    </span>
                </button>
            </div>
        </section>

        <section id="constellation-screen" class="screen" aria-label="Una carta entre las estrellas" hidden>
            <header class="journey-header">
                <span class="journey-signature">Para Alexandra</span>
                <span id="journey-progress" class="sr-only" role="status"></span>
            </header>
            <div id="nodes-container"></div>
            <div id="star-transition" aria-hidden="true"></div>
            <p id="click-guide" class="click-guide">Toca la estrella que brilla para comenzar</p>
            <div id="content-modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="chapter-title" inert>
                <article class="glass-card">
                    <h2 id="chapter-title" class="sr-only">Para Alexandra</h2>
                    <div class="letter-ornament" aria-hidden="true">
                        <svg viewBox="0 0 240 36"><path d="M10 18 C35 18 38 2 58 10 S82 26 102 18 M230 18 C205 18 202 2 182 10 S158 26 138 18 M112 18 L120 10 L128 18 L120 26 Z"/></svg>
                        <span>Para ti</span>
                    </div>
                    <div id="modal-body" class="letter-content"></div>
                    <footer class="chapter-footer">
                        <button id="next-btn" class="next-btn">Siguiente <span aria-hidden="true">&#8594;</span></button>
                    </footer>
                </article>
            </div>
            <div id="finale" class="finale" hidden>
                <h2 class="sr-only">Alexandra</h2>
                <p>Quiz&aacute; lo m&aacute;s bonito de coincidir contigo<br class="desktop-break"> todav&iacute;a est&eacute; por pasar.</p>
                <button id="replay-btn" class="text-btn">Volver a recorrer las estrellas <span aria-hidden="true">&#8634;</span></button>
            </div>
        </section>
    </main>
    <dialog id="photo-viewer" aria-label="Foto de Alexandra">
        <button id="close-photo" class="close-photo" aria-label="Cerrar foto" autofocus>&times;</button>
        <img src="WhatsApp%20Image%202026-11-08%20at%201.53.35%20PM.jpeg" alt="Alexandra" class="full-photo">
    </dialog>
    <button id="mute-btn" class="music-control" aria-label="Activar m&uacute;sica" aria-pressed="false" hidden>
        <span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span id="sound-label">Sonido</span>
    </button>
    <audio id="bg-music" loop preload="none"><source src="musica.mp3" type="audio/mpeg"></audio>
    <script src="metrics.js?v=lectura-1"></script>
    <script src="script.js?v=nombre-estelar-1"></script>
</body>
</html>
